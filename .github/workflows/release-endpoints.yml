# RD-Nexus has one release authority: this repository's GitHub Releases. The notify-only check,
# beta channel, signed Tauri feed and download button must never fall back to upstream Nexus or a
# downstream mirror. This monitor verifies the one derived artifact that can drift: latest.json.

name: Release endpoints

on:
  schedule:
    # 14:00 UTC daily. Late enough that an evening release has had a night's grace.
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      grace_hours:
        description: 'Hours after publish before a stale feed is an error'
        required: false
        default: '12'

permissions:
  contents: read

jobs:
  drift:
    name: Update feeds match the latest release
    runs-on: ubuntu-latest
    steps:
      - name: Compare every update feed against the latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GRACE_HOURS: ${{ github.event.inputs.grace_hours || '12' }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          from datetime import datetime, timezone

          GRACE = float(os.environ.get("GRACE_HOURS") or 12)

          TOKEN = os.environ.get("GH_TOKEN", "")
          REPOSITORY = os.environ["GH_REPOSITORY"]

          def get(url, tries=3):
              """Fetch with retries. A transient blip must not red the badge, but an
              update endpoint that is genuinely unreachable is itself a real fault --
              so exhausting the retries is reported, never silently tolerated."""
              hdr = {"User-Agent": "nexus-release-endpoints", "Cache-Control": "no-cache"}
              # GH_TOKEN goes to api.github.com and NOWHERE else. Two reasons, and
              # both were live bugs waiting to happen. (1) Without it the API call
              # below is UNAUTHENTICATED, and an Actions runner shares its egress IP
              # with the rest of the fleet, so it draws on the 60/hour anonymous
              # quota and gets a 403 that has nothing to do with feed drift -- this
              # file's own header argues that a check which cries wolf is worse than
              # no check, and that is exactly how it would have started. (2) urllib
              # carries headers across a redirect to a DIFFERENT HOST, and the
              # releases/latest/download URL redirects to a CDN, so a token attached
              # to that request is a token handed to the CDN. Hence the prefix test
              # rather than a blanket header.
              if TOKEN and url.startswith("https://api.github.com/"):
                  hdr["Authorization"] = "Bearer " + TOKEN
                  hdr["Accept"] = "application/vnd.github+json"
              last = None
              for _ in range(tries):
                  try:
                      req = urllib.request.Request(url, headers=hdr)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.read().decode("utf-8", "replace")
                  except Exception as e:          # noqa: BLE001 - report, don't classify
                      last = e
              raise RuntimeError(f"unreachable after {tries} tries: {url} ({last})")

          # --- the reference: what GitHub calls the latest release -----------------
          rel = json.loads(get(f"https://api.github.com/repos/{REPOSITORY}/releases/latest"))
          tag = rel["tag_name"]                      # e.g. v1.0.1
          want = tag.lstrip("v")
          published = datetime.strptime(rel["published_at"], "%Y-%m-%dT%H:%M:%SZ") \
                              .replace(tzinfo=timezone.utc)
          age_h = (datetime.now(timezone.utc) - published).total_seconds() / 3600
          print(f"latest release: {tag}  (published {rel['published_at']}, {age_h:.1f} h ago)")
          print(f"grace window:   {GRACE} h\n")

          # --- every feed that can disagree ---------------------------------------
          problems, checked = [], []

          def check(name, got, fix):
              ok = (got == want)
              checked.append((name, got, ok))
              print(f"  {'OK  ' if ok else 'STALE'}  {name:34} {got}")
              if not ok:
                  problems.append((name, got, fix))

          # 1. The Tauri updater manifest. Generated by release.yml from the tag and
          #    hard-gated against tauri.conf.json, so it cannot drift on its own -- a
          #    mismatch here means the release itself is malformed, not a missed step.
          lj = json.loads(get(
              f"https://github.com/{REPOSITORY}/releases/latest/download/latest.json"))
          check("latest.json (self-update)", lj.get("version", "?"),
                "the release is malformed -- re-run release.yml for this tag")

          if not problems:
              print(f"\nAll {len(checked)} feeds agree on {want}.")
              sys.exit(0)

          print(f"\n{len(problems)} feed(s) disagree with {tag}:\n")
          for name, got, fix in problems:
              print(f"  * {name}: serves {got}, release is {want}")
              print(f"     fix: {fix}\n")

          if age_h < GRACE:
              print(f"Within the {GRACE} h grace window ({age_h:.1f} h since publish) -- "
                    "the manual publish steps are probably still in progress. "
                    "Reporting, not failing.")
              sys.exit(0)

          print("The signed self-update manifest disagrees with this repository's release.")
          sys.exit(1)
          PY
